<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - Gramin Saathi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background:#f4f6f4; font-family: Arial, sans-serif; }
    .login-box {
      max-width: 380px; margin: 90px auto; background:#fff; padding:35px 30px;
      border-radius:10px; box-shadow:0 4px 18px rgba(0,0,0,0.08);
    }
    .login-box h2 { text-align:center; color:#2e7d32; margin-bottom:5px; font-size:22px; }
    .login-box p.sub { text-align:center; color:#777; margin-bottom:25px; font-size:13px; }
    .login-box label { font-size:13px; font-weight:600; color:#333; }
    .login-box input {
      width:100%; padding:10px 12px; margin-bottom:15px; border:1px solid #ddd;
      border-radius:6px; font-size:14px;
    }
    .login-box button {
      width:100%; padding:11px; background:#2e7d32; color:#fff; border:none;
      border-radius:6px; font-size:15px; cursor:pointer;
    }
    .login-box button:hover { background:#256428; }
    #errorMsg { color:#c0392b; font-size:13px; text-align:center; margin-top:10px; display:none; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>🌾 Gramin Saathi</h2>
    <p class="sub">Admin Panel Login</p>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required placeholder="admin@example.com">
      <label>Password</label>
      <input type="password" id="password" required placeholder="••••••••">
      <button type="submit">Login</button>
    </form>
    <p id="errorMsg"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    // If already logged in, go straight to dashboard
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = "dashboard.html";
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.style.display = 'none';

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.textContent = "Login failed: " + error.message;
        errorMsg.style.display = 'block';
        return;
      }
      window.location.href = "dashboard.html";
    });
  </script>
</body>
</html>
